apiVersion: v1
kind: Secret
metadata:
  name: records-mysql
type: Opaque
stringData:
  mysql-root-password: records_root
  mysql-user: records
  mysql-password: records
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: records-mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: records-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: records-mysql
  template:
    metadata:
      labels:
        app: records-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_DATABASE
              value: records
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: records-mysql
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: records-mysql
                  key: mysql-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: records-mysql
                  key: mysql-root-password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: records-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: records-mysql
spec:
  selector:
    app: records-mysql
  ports:
    - port: 3306
      targetPort: 3306
